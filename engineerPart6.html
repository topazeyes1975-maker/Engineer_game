<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fonda's Engineering Sandbox: Level 6 - Output Speed & Torque</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --success: #4ade80;
            --error: #f87171;
            --shop-accent: #a855f7;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 { margin-top: 0; color: var(--accent); font-size: 1.5rem; }
        .lesson {
            background: rgba(56, 189, 248, 0.1);
            border-left: 4px solid var(--accent);
            padding: 12px 16px;
            margin-bottom: 20px;
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .target-panel {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.3);
            padding: 10px 16px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .target-panel span { color: #f87171; font-weight: bold; }
        canvas {
            background: #090d16;
            border-radius: 8px;
            width: 100%;
            height: 220px;
            display: block;
            margin-bottom: 20px;
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
        }
        label { font-size: 0.85rem; margin-bottom: 6px; color: #94a3b8; }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        #status {
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
            min-height: 24px;
        }
        .nav-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }
        .next-btn {
            display: none;
            background: var(--success);
        }
        .shop-btn {
            background: var(--shop-accent);
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Engineering Logic: Output Speed</h1>
    
    <div class="lesson">
        <strong>The Engineering Principle:</strong> Speed and torque are inversely proportional. 
        <em>Output Speed = Input Speed × (Driver Teeth / Driven Teeth)</em>. The "Driven" gear is your Output gear!
    </div>

    <!-- Permanent UI Panel showing puzzle specs -->
    <div class="target-panel">
        <div>Input Motor: <span>300 RPM (20 Teeth Driver)</span></div>
        <div>Target Output Speed: <span>100 RPM</span></div>
    </div>

    <canvas id="simCanvas" width="650" height="220"></canvas>

    <div class="controls">
        <div class="control-group">
            <label for="drivenInput">Select Driven (Output) Gear Teeth: <span id="drivenVal">40</span> teeth</label>
            <input type="range" id="drivenInput" min="10" max="80" step="2" value="40">
        </div>
    </div>

    <button id="testBtn">Test Output Speed</button>
    <div id="status"></div>
    
    <!-- Navigation Panel: Next Level & Shop Buttons -->
    <div class="nav-grid">
        <button class="next-btn" id="nextBtn" onclick="location.href='engineerPart7.html'">Next Level: Level 7</button>
        <button class="shop-btn" onclick="location.href='blue-tinkerluff.html'">🛒 Shop: Parts & Codes list</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    
    const drivenInput = document.getElementById('drivenInput');
    const drivenVal = document.getElementById('drivenVal');
    const testBtn = document.getElementById('testBtn');
    const statusDiv = document.getElementById('status');
    const nextBtn = document.getElementById('nextBtn');

    const inputSpeed = 300; // RPM
    const driverTeeth = 20; // Teeth
    const targetOutputSpeed = 100; // RPM

    function drawScene(drivenTeethCount) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const centerY = 110;
        const driverX = 200;
        const drivenX = 450;

        // Use proportional radii so circles look clean and perfectly round
        const scaleFactor = 2.5;
        const driverRadius = driverTeeth * scaleFactor;
        const drivenRadius = drivenTeethCount * scaleFactor;

        // Draw Driver Gear (Input)
        ctx.beginPath();
        ctx.arc(driverX, centerY, driverRadius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(56, 189, 248, 0.15)';
        ctx.fill();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`Input Driver`, driverX, centerY - driverRadius - 8);
        ctx.fillText(`${driverTeeth} Teeth`, driverX, centerY + 4);

        // Draw Driven Gear (Output)
        ctx.beginPath();
        ctx.arc(drivenX, centerY, drivenRadius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(248, 113, 113, 0.15)';
        ctx.fill();
        ctx.strokeStyle = '#f87171';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.fillText(`Driven Output`, drivenX, centerY - drivenRadius - 8);
        ctx.fillText(`${drivenTeethCount} Teeth`, drivenX, centerY + 4);
    }

    function updateDisplay() {
        const t = parseInt(drivenInput.value);
        drivenVal.textContent = t;
        drawScene(t);
        nextBtn.style.display = 'none';
    }

    drivenInput.addEventListener('input', updateDisplay);

    testBtn.addEventListener('click', () => {
        const t = parseInt(drivenInput.value);
        const currentOutputSpeed = inputSpeed * (driverTeeth / t);

        if (Math.abs(currentOutputSpeed - targetOutputSpeed) < 0.1) {
            statusDiv.style.color = 'var(--success)';
            statusDiv.textContent = `Success! Target output speed of ${targetOutputSpeed} RPM achieved precisely with ${t} teeth! Level Cleared!`;
            nextBtn.style.display = 'block';
        } else if (currentOutputSpeed > targetOutputSpeed) {
            statusDiv.style.color = 'var(--error)';
            statusDiv.textContent = `Speed too high (${currentOutputSpeed.toFixed(0)} RPM). Make the Driven gear larger to slow it down!`;
            nextBtn.style.display = 'none';
        } else {
            statusDiv.style.color = 'var(--error)';
            statusDiv.textContent = `Speed too low (${currentOutputSpeed.toFixed(0)} RPM). The Driven gear is too big. Scale it back!`;
            nextBtn.style.display = 'none';
        }
    });

    updateDisplay();
</script>

</body>
</html>
